name: zero
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Local Database
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.3.1

  # Routing
  go_router: ^17.2.3

  # Charts
  fl_chart: ^1.2.0

  # Animations
  flutter_animate: ^4.5.2

  # Notifications
  flutter_local_notifications: ^19.4.0

  # Fonts
  google_fonts: ^6.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.1

  # Storage Utilities
  path_provider: ^2.1.5

  # SVG Support
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.6.0
  hive_ce_generator: ^1.9.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: assets/logo/logo.png
  android: true
  ios: true
  fullscreen: true
